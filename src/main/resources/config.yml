calendar:
  # How many in-game days each season lasts. Each must be a whole number of at least 1.
  days-per-season:
    spring: 28
    summer: 28
    autumn: 28
    winter: 28
growth:
  # How fast crops grow in each season. 1.0 is vanilla, 0.5 is half speed, 2.0 is double.
  # Each must be a number of at least 0; 0 stops crop growth for that season.
  multiplier:
    spring: 1.5
    summer: 1.0
    autumn: 0.75
    winter: 0.25
weather:
  # The chance, from 0 to 1, that each new natural weather period is rainy (rain-chance)
  # or thundery (thunder-chance). Thunder is only seen while it is also raining.
  spring:
    rain-chance: 0.6
    thunder-chance: 0.2
  summer:
    rain-chance: 0.3
    thunder-chance: 0.3
  autumn:
    rain-chance: 0.5
    thunder-chance: 0.4
  winter:
    rain-chance: 0.4
    thunder-chance: 0.05
announcement:
  # Whether a chat message is broadcast to everyone when the season changes.
  enabled: true
  # The message. {season} is replaced with the new season; & colour codes are allowed.
  # A blank message announces nothing.
  message: '&6It is now {season}.'
day-length:
  # 'off' leaves the day length to vanilla (or to Timescale). 'real-place' makes each in-game day
  # as long, in daylight, as the real date it stands for at the place below. The whole day keeps
  # its vanilla length; only the split between day and night changes.
  mode: 'off'
  # The place, in degrees: latitude -90 to 90 (north positive), longitude -180 to 180 (east positive).
  # Only the console sees these values; players are never shown them.
  latitude: 51.5
  longitude: -0.13
  # The real month and day that spring day 1 stands for, such as '03-20'. 'auto' uses the March
  # equinox north of the equator and the September equinox south of it.
  spring-starts: auto
